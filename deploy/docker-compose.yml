# Production stack. The image is built in CI and pulled from GHCR.
# Local development uses the backend Dockerfile / uvicorn directly.
services:
  backend:
    image: ${IMAGE:?IMAGE must be set}
    restart: unless-stopped
    env_file: .env
    # Published for the frontend (Vercel rewrite or NEXT_PUBLIC_API_URL) to
    # reach the API at http://HOST:8000. No reverse proxy in this template.
    ports:
      - "8000:8000"
