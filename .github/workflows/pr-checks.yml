name: PR checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr-template:
    name: pr-template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/github-script@v9
        with:
          script: |
            const risk = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-risk.cjs`);
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number: pr.number, per_page: 100,
            });

            const { level, error } = risk.evaluate(pr, files);
            if (error) {
              core.setFailed(error);
              return;
            }
            await risk.syncRiskLabel({ github, context, pr, level });

            const lock = /(package-lock\.json|pnpm-lock\.yaml|yarn\.lock|uv\.lock|poetry\.lock)$/;
            const changed = files
              .filter(f => !lock.test(f.filename))
              .reduce((n, f) => n + f.additions + f.deletions, 0);
            if (changed > 400) {
              core.warning(`This PR changes ${changed} lines (limit ~400). Consider splitting it.`);
            }
